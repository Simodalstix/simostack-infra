AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Storage and delivery for the /factory artwork: a private S3 bucket readable only by its own
  CloudFront distribution at assets.simostack.com. Viewing through CloudFront is public; the bucket
  is not. Separate from the live site distribution so a mistake here cannot affect simostack.com,
  and so the site deploy's `s3 sync --delete` never touches the artwork. Stack factory-assets-site
  in ap-southeast-2.

Parameters:
  DomainName:
    Type: String
    Default: assets.simostack.com
  CertificateArn:
    Type: String
    Description: CertificateArn output of factory-assets-cert (us-east-1).
    AllowedPattern: 'arn:aws:acm:us-east-1:[0-9]{12}:certificate/.+'
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id

Resources:
  AssetBucket:
    Type: AWS::S3::Bucket
    # Holds the only copy of the artwork outside the owner's machine; never delete with the stack.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub simostack-factory-assets-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub simostack-factory-assets-${AWS::AccountId}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: SimoStack /factory assets
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        # Australia and New Zealand edge locations are only in PriceClass_All.
        PriceClass: PriceClass_All
        Aliases: [!Ref DomainName]
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: assets
            DomainName: !GetAtt AssetBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        # No custom error responses: a missing key is a 403 from S3, never an HTML page, so the
        # site's img error fallback shows its placeholder.
        DefaultCacheBehavior:
          TargetOriginId: assets
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized. Keys under factory/vN/ are immutable; publish a new version
          # prefix instead of invalidating.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed SecurityHeadersPolicy.
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  AssetBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssetBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Only the served prefix, and only through this distribution. Anything else in the bucket
          # (for example originals, if ever stored) stays unreadable.
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${AssetBucket.Arn}/factory/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  DomainRecord:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Value: !Ref AssetBucket
  DistributionId:
    Value: !Ref Distribution
  AssetBase:
    Description: Value for the vue-simostack FACTORY_ASSET_BASE repo variable.
    Value: !Sub https://${DomainName}/factory/v1
